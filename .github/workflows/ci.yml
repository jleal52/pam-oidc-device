name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  DEBIAN_FRONTEND: noninteractive

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - name: Install PAM headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libpam0g-dev
      - name: Unit tests
        run: go test ./... -race -count=1
      - name: Vet
        run: go vet ./...
      - name: Build the C module natively and check exported symbols
        run: make so-native check-so
      - name: Build the C module in Debian 12 and check the glibc ceiling
        run: make so-docker check-so check-glibc
      - name: Build the helper
        run: make helper
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pam_oidc_device-${{ runner.arch }}.so
          path: build/pam_oidc_device.so
          if-no-files-found: error

  lint:
    name: lint and vulncheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.9.0
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  integration:
    name: pamtester integration (Docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - name: Run the pamtester scenarios in a stock Debian container
        run: make integration
      - name: Run the scenarios through a real OpenSSH server
        run: make integration-sshd
