# pam-oidc-device configuration, shared by the PAM module and oidc-ssh.
#
# Copy to /etc/oidc-ssh/config.yaml (the default path; another location can
# be given with the "config=" module argument). The pre-0.2.0 path
# /etc/security/pam_oidc_device.yaml is still read when the default does not
# exist. Make the file readable by root and the oidc-ssh user only (0640
# root:oidc-ssh) and adjust the values below. The file is read on every
# login attempt, so edits take effect immediately.
#
# How access works
# ----------------
# A login as local account X is allowed only if the identity provider returns
# an ID token whose groups claim contains the group mapped to X in "users".
# The provider authenticates the person; this file decides which group may
# become which local account. Accounts that are not listed are ignored by the
# module (PAM_IGNORE), so root and service users keep authenticating with
# whatever else is in the PAM stack.
#
# Login time budget
# -----------------
# In the worst case a login takes about
#     timeout + 4 x http_timeout
# (device flow wait, plus discovery, device authorization request, token poll
# and JWKS fetch). With the defaults below that is 300s + 4x10s = 340s. sshd
# kills sessions that have not authenticated within LoginGraceTime, and its
# default is 120s, so set in sshd_config
#     LoginGraceTime 400
# or lower "timeout" here so that the budget fits.

# Issuer URL of the OpenID Connect provider (required). Discovery is fetched
# from <issuer>/.well-known/openid-configuration and the value must match the
# "issuer" field of that document byte for byte, trailing slash included.
issuer: https://login.example.com

# OAuth 2.0 client registered at the provider for the device flow (required).
# It must be a public client with the device authorization grant enabled;
# no client secret is used.
client_id: ssh-bastion

# Scopes requested from the provider. The username and groups claims below
# must be released under these scopes. Default: "openid profile email groups".
scope: openid profile email groups

# Name shown to the user at the login prompt and, on some providers, in the
# consent screen. "{{hostname}}" is replaced by the machine hostname.
# Default: "{{hostname}}".
device_name: "{{hostname}}"

# ID token claim exported as the identity of the session. Default: "email".
username_claim: email

# ID token claim holding the list of groups (a JSON array of strings; a
# missing claim means no groups). Default: "groups".
groups_claim: groups

# Environment variable that receives username_claim in the session. OIDC_SUB
# (the token subject) is exported alongside it. Default: "OIDC_USER".
session_env: OIDC_USER

# Time the user has to complete the sign-in in the browser. The provider's
# device code lifetime applies as well; the shorter wins. Default: 300s.
timeout: 300s

# Tolerance for clock differences when checking token timestamps.
# Default: 60s.
clock_skew: 60s

# Bound on every single HTTP request to the provider. Default: 10s.
http_timeout: 10s

# Plain http:// issuers and API bases are rejected unless this is true. It
# exists only for tests against a local mock provider: never enable it on a
# real host, the token would travel unencrypted and the issuer could be
# spoofed.
# allow_insecure_http: false

# Key-based access (oidc-ssh, see docs/PROVIDER-CONTRACT.md)
# ----------------------------------------------------------
# The keys below are only used once the host is enrolled with
# "oidc-ssh enroll"; the plain device flow ignores them.

# Base URL of the provider's SSH access API. Optional: when absent, the
# "ssh_access_endpoint" of the discovery document is used, and failing that
# <issuer>/api/ssh. Kept verbatim (no trailing-slash normalisation); must be
# https unless allow_insecure_http is set. Written by "oidc-ssh enroll".
# api_base: https://login.example.com/api/ssh

# Identifier assigned to this host by the provider at enrolment. Written by
# "oidc-ssh enroll"; leave unset until then.
# host_id: 6a9f0c2e-1b7d-4e0a-9c1f-2d3e4f5a6b7c

# Absolute path of the host's Ed25519 private key (0640 root:oidc-ssh).
# Default: /etc/oidc-ssh/host.key.
identity_key: /etc/oidc-ssh/host.key

# Absolute path of the last-known-good authorized-keys cache (0700 oidc-ssh).
# Default: /var/cache/oidc-ssh.
cache_dir: /var/cache/oidc-ssh

# Maximum age of a cached answer that may be served while the provider is
# unreachable (network error, timeout or 5xx). Denials are never cached.
# "0s" disables the cache. Default: 24h.
cache_ttl: 24h

# Local account -> group required in groups_claim (at least one entry). Every
# member of the group logs in as that account; the personal identity is kept
# in the session environment (see session_env) and in the syslog audit line.
users:
  systems: ssh:admin
  ops: ssh:ops
